<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recipe ساز محصول</title>

    <style>
        body{
            direction: rtl;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            margin: 0;
            padding: 24px;
            color:#111827;
        }
        .container{ max-width: 980px; margin: 0 auto; }

        .header{
            background: #ffffff;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
            display:flex;
            align-items:center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header h2{ margin:0; font-size:18px; font-weight:800; }

        .btn{
            border:none;
            border-radius: 10px;
            padding: 10px 14px;
            cursor:pointer;
            font-size:14px;
            transition:0.15s;
        }
        .btn:hover{ opacity:0.92; transform: translateY(-1px); }
        .btn.primary{ background:#0ea5e9; color:#fff; }
        .btn.gray{ background:#64748b; color:#fff; }
        .btn.light{ background:#e2e8f0; color:#0f172a; }

        /* ===== Modal ===== */
        .modal-backdrop{
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.45);
            display:none;
            align-items:center;
            justify-content:center;
            padding: 18px;
            z-index: 50;
        }
        .modal{
            width: min(720px, 100%);
            background:#fff;
            border-radius: 16px;
            box-shadow: 0 14px 40px rgba(0,0,0,0.25);
            overflow:hidden;
        }
        .modal-head{
            padding: 14px 16px;
            background:#f1f5f9;
            display:flex;
            align-items:center;
            justify-content: space-between;
            gap: 10px;
        }
        .modal-head h3{ margin:0; font-size:16px; font-weight:900; }
        .modal-body{ padding: 16px; }

        .grid{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media(max-width: 760px){
            .grid{ grid-template-columns: 1fr; }
        }

        label{
            display:block;
            font-size: 13px;
            color:#334155;
            margin-bottom: 6px;
            font-weight: 800;
        }
        input{
            width: 100%;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px 12px;
            outline: none;
            font-size: 14px;
            transition: 0.15s;
            background:#fff;
        }
        input:focus{
            border-color:#0ea5e9;
            box-shadow: 0 0 0 3px rgba(14,165,233,0.12);
        }

        .picker-wrap{
            position: relative;
        }
        .picker-list{
            margin-top: 8px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            max-height: 220px;
            overflow: auto;
            background:#fff;
            display:none;
        }
        .picker-item{
            padding: 10px 12px;
            cursor:pointer;
            border-bottom: 1px solid #eef2f7;
            font-size: 14px;
            text-align: right;
        }
        .picker-item:last-child{ border-bottom:none; }
        .picker-item:hover{ background:#f8fafc; }

        .muted{ color:#64748b; font-size: 12px; margin-top: 8px; }

        .modal-foot{
            padding: 14px 16px;
            display:flex;
            gap: 10px;
            justify-content:flex-end;
            border-top: 1px solid #e5e7eb;
            background:#fff;
            flex-wrap: wrap;
        }

        .status{
            margin-top: 12px;
            border-radius: 12px;
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            font-size: 13px;
            line-height: 1.8;
            display:none;
            white-space: pre-wrap;
        }
        .status.ok{ border-color: rgba(34,197,94,0.35); background: rgba(34,197,94,0.10); }
        .status.err{ border-color: rgba(239,68,68,0.35); background: rgba(239,68,68,0.10); }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h2>Recipe محصول</h2>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn primary" onclick="openModal()">➕ ایجاد</button>
        </div>
    </div>

    <div id="pageStatus" class="status"></div>

</div>

<!-- ===== Modal ===== -->
<div id="modalBackdrop" class="modal-backdrop" onclick="backdropClick(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head">
            <h3>ایجاد Recipe جدید</h3>
            <button class="btn light" onclick="closeModal()">✖ بستن</button>
        </div>

        <div class="modal-body">
            <div class="grid">

                <!-- Product picker -->
                <div class="picker-wrap">
                    <label for="productName">نام محصول</label>
                    <input id="productName"
                           type="text"
                           placeholder="کلیک کن تا لیست محصولات بیاد"
                           readonly
                           onclick="toggleProducts()"/>

                    <div id="productsList" class="picker-list"></div>
                    <div class="muted">با کلیک روی فیلد، لیست از دیتابیس لود می‌شود.</div>
                </div>

                <!-- Inventory picker -->
                <div class="picker-wrap">
                    <label for="inventoryName">نام اینونتوری</label>
                    <input id="inventoryName"
                           type="text"
                           placeholder="کلیک کن تا لیست اینونتوری‌ها بیاد"
                           readonly
                           onclick="toggleInventories()"/>

                    <div id="inventoriesList" class="picker-list"></div>
                    <div class="muted">با کلیک روی فیلد، لیست از دیتابیس لود می‌شود.</div>
                </div>

                <!-- Amount -->
                <div>
                    <label for="amount">تعداد (amount)</label>
                    <input id="amount" type="number" min="0" placeholder="مثلاً 10"/>
                </div>

            </div>

            <div id="modalStatus" class="status"></div>
        </div>

        <div class="modal-foot">
            <button class="btn gray" onclick="closeModal()">انصراف</button>
            <button id="submitBtn" class="btn primary" onclick="submitRecipe()">ثبت ✅</button>
        </div>
    </div>
</div>

<script>
    // ========= تنظیم کن مطابق کنترلر خودت =========
    // اگر کنترلر مثلا روی /product-recipe هست:
    // const BASE = "/product-recipe";
    const BASE = "/recipe-product"; // اگر endpoint ها ریشه‌ای هستن همین خالی بمونه

    const EP_PRODUCTS = `/ProductManaging/`;
    const EP_INVENTORIES = `${BASE}/get-inventoriesNames`;
    const EP_SAVE = `${BASE}/add-product-recipe`;

    // ===== Modal open/close =====
    function openModal(){
        hideStatus("modalStatus");
        document.getElementById("modalBackdrop").style.display = "flex";
        // reset
        document.getElementById("productName").value = "";
        document.getElementById("inventoryName").value = "";
        document.getElementById("amount").value = "";
        hidePickers();
    }

    function closeModal(){
        hidePickers();
        document.getElementById("modalBackdrop").style.display = "none";
    }

    function backdropClick(e){
        // کلیک روی بک‌دراپ => بستن
        if(e.target.id === "modalBackdrop") closeModal();
    }

    function hidePickers(){
        document.getElementById("productsList").style.display = "none";
        document.getElementById("inventoriesList").style.display = "none";
    }

    // ====== Products picker ======
    let productsLoaded = false;
    async function toggleProducts(){
        const list = document.getElementById("productsList");
        const invList = document.getElementById("inventoriesList");
        invList.style.display = "none";

        if(list.style.display === "block"){
            list.style.display = "none";
            return;
        }

        list.style.display = "block";
        if(!productsLoaded){
            await loadProducts();
            productsLoaded = true;
        }
    }

    async function loadProducts(){
        const list = document.getElementById("productsList");
        list.innerHTML = `<div class="picker-item" style="cursor:default;">در حال دریافت…</div>`;

        try{
            const res = await fetch("ProductManaging/get-productsNames", { method: "GET" });
            if(!res.ok){
                const t = await res.text();
                throw new Error(t || "خطا در دریافت محصولات");
            }
            const data = await res.json(); // ArrayList<String>
            renderPickerList(list, data, (val) => {
                document.getElementById("productName").value = val;
                list.style.display = "none";
            });
        }catch(e){
            list.innerHTML = `<div class="picker-item" style="cursor:default;">❌ خطا در دریافت لیست</div>`;
            showStatus("modalStatus", "مشکل دریافت محصولات:\n" + (e?.message || e), true);
        }
    }

    // ====== Inventories picker ======
    let inventoriesLoaded = false;
    async function toggleInventories(){
        const list = document.getElementById("inventoriesList");
        const prodList = document.getElementById("productsList");
        prodList.style.display = "none";

        if(list.style.display === "block"){
            list.style.display = "none";
            return;
        }

        list.style.display = "block";
        if(!inventoriesLoaded){
            await loadInventories();
            inventoriesLoaded = true;
        }
    }

    async function loadInventories(){
        const list = document.getElementById("inventoriesList");
        list.innerHTML = `<div class="picker-item" style="cursor:default;">در حال دریافت…</div>`;

        try{
            const res = await fetch("inventory_managing/get-inventoriesNames", { method: "GET" });
            if(!res.ok){
                const t = await res.text();
                throw new Error(t || "خطا در دریافت اینونتوری‌ها");
            }
            const data = await res.json(); // ArrayList<String>
            renderPickerList(list, data, (val) => {
                document.getElementById("inventoryName").value = val;
                list.style.display = "none";
            });
        }catch(e){
            list.innerHTML = `<div class="picker-item" style="cursor:default;">❌ خطا در دریافت لیست</div>`;
            showStatus("modalStatus", "مشکل دریافت اینونتوری‌ها:\n" + (e?.message || e), true);
        }
    }

    // ====== Render list helper ======
    function renderPickerList(container, arr, onPick){
        if(!Array.isArray(arr) || arr.length === 0){
            container.innerHTML = `<div class="picker-item" style="cursor:default;">لیستی پیدا نشد.</div>`;
            return;
        }

        container.innerHTML = "";
        arr.forEach(item => {
            const val = String(item ?? "").trim();
            if(!val) return;

            const el = document.createElement("div");
            el.className = "picker-item";
            el.textContent = val;
            el.onclick = () => onPick(val);
            container.appendChild(el);
        });
    }

    // ====== Submit ======
    async function submitRecipe(){
        hideStatus("modalStatus");

        const productName = document.getElementById("productName").value.trim();
        const inventoryName = document.getElementById("inventoryName").value.trim();
        const amountRaw = document.getElementById("amount").value;
        const amount = Number(amountRaw);

        if(!productName){
            showStatus("modalStatus", "نام محصول را انتخاب کن.", true);
            return;
        }
        if(!inventoryName){
            showStatus("modalStatus", "نام اینونتوری را انتخاب کن.", true);
            return;
        }
        if(amountRaw === "" || Number.isNaN(amount)){
            showStatus("modalStatus", "amount معتبر وارد کن.", true);
            return;
        }

        const payload = { productName, inventoryName, amount };

        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.textContent = "در حال ثبت…";

        try{
            const res = await fetch("/recipe-product/add-product-recipe", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            // چون کنترلر void هست، ممکنه 200 با body خالی بده
            if(!res.ok){
                const t = await res.text();
                throw new Error(t || "ثبت ناموفق");
            }

            btn.disabled = false;
            btn.textContent = "ثبت ✅";
            showStatus("modalStatus", "✅ با موفقیت ثبت شد.", false);

            // اختیاری: بعد 700ms ببند
            setTimeout(() => closeModal(), 700);

        }catch(e){
            btn.disabled = false;
            btn.textContent = "ثبت ✅";
            showStatus("modalStatus", "❌ خطا در ثبت:\n" + (e?.message || e), true);
        }
    }

    // ====== Status helpers ======
    function showStatus(id, msg, isError){
        const el = document.getElementById(id);
        el.style.display = "block";
        el.classList.remove("ok", "err");
        el.classList.add(isError ? "err" : "ok");
        el.textContent = msg;
    }

    function hideStatus(id){
        const el = document.getElementById(id);
        el.style.display = "none";
        el.textContent = "";
        el.classList.remove("ok", "err");
    }

    // بستن لیست‌ها با کلیک بیرون از input ها
    document.addEventListener("click", (e) => {
        const prodInput = document.getElementById("productName");
        const invInput = document.getElementById("inventoryName");
        const prodList = document.getElementById("productsList");
        const invList = document.getElementById("inventoriesList");

        if(e.target !== prodInput && !prodList.contains(e.target)) prodList.style.display = "none";
        if(e.target !== invInput && !invList.contains(e.target)) invList.style.display = "none";
    });
</script>

</body>
</html>
