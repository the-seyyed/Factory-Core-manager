<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مدیریت اینونتوری‌ها</title>

  <style>
    body{
      direction: rtl;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      margin: 0;
      padding: 24px;
      color:#111827;
    }

    .container{
      max-width: 980px;
      margin: 0 auto;
    }

    .header{
      background: #ffffff;
      border-radius: 14px;
      padding: 18px 18px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      display:flex;
      gap: 12px;
      align-items:center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .header h2{
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .actions{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn{
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.15s;
    }
    .btn:hover{ opacity: 0.92; transform: translateY(-1px); }
    .btn.primary{ background:#0ea5e9; color:#fff; }
    .btn.gray{ background:#64748b; color:#fff; }
    .btn.light{ background:#e2e8f0; color:#0f172a; }

    .card{
      margin-top: 14px;
      background: #ffffff;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items:end;
    }

    label{
      display:block;
      font-size: 13px;
      color:#334155;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input{
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
      font-size: 14px;
      transition: 0.15s;
    }
    input:focus{
      border-color:#0ea5e9;
      box-shadow: 0 0 0 3px rgba(14,165,233,0.12);
    }

    table{
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 12px;
    }

    th, td{
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 10px;
      text-align: center;
      font-size: 14px;
    }
    th{
      background:#f1f5f9;
      font-weight: 800;
    }
    tr:hover td{ background:#f8fafc; }

    .status{
      margin-top: 12px;
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      font-size: 13px;
      line-height: 1.8;
      display:none;
      white-space: pre-wrap;
    }
    .status.ok{ border-color: rgba(34,197,94,0.35); background: rgba(34,197,94,0.10); }
    .status.err{ border-color: rgba(239,68,68,0.35); background: rgba(239,68,68,0.10); }

    .muted{ color:#64748b; font-size: 13px; margin: 8px 0 0; }

    @media(max-width: 760px){
      .grid{ grid-template-columns: 1fr; }
    }

     .cell-input{
       width: 95%;
       padding: 8px 10px;
       border: 1px solid #e5e7eb;
       border-radius: 10px;
       font-size: 14px;
       outline: none;
       text-align: center;
     }
    .cell-input:focus{
      border-color:#0ea5e9;
      box-shadow: 0 0 0 3px rgba(14,165,233,0.12);
    }

    .row-save{
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      display: none; /* پیشفرض مخفی */
      transition: 0.15s;
    }
    .row-save:hover{ opacity: 0.92; transform: translateY(-1px); }

  </style>
</head>

<body>
<div class="container">

  <div class="header">
    <h2>مدیریت اینونتوری‌ها</h2>
    <div class="actions">
      <button class="btn light" onclick="refreshInventories()">🔄 رفرش</button>
      <!-- اگر صفحه اصلی داری، میتونی اینو نگه داری یا حذف کنی -->
      <button class="btn gray" onclick="goHome()">🏠 صفحه اصلی</button>
    </div>
  </div>

  <!-- فرم افزودن -->
  <div class="card">
    <div class="grid">
      <div>
        <label for="invName">نام</label>
        <input id="invName" type="text"  />
      </div>

      <div>
        <label for="invAmount">مقدار (amount)</label>
        <input id="invAmount" type="number"  />
      </div>

      <div>
        <button class="btn primary" onclick="addNewInventory()">➕ ثبت اینونتوری</button>
      </div>
    </div>


    <div id="status" class="status"></div>
  </div>

  <!-- جدول لیست -->
  <div class="card">
    <table>
      <thead>
      <tr>
        <th>#</th>
        <th>نام</th>
        <th>مقدار</th>
        <th>عملیات</th>
      </tr>
      </thead>

      <tbody id="invBody"></tbody>
      <tr><td colspan="3">در حال دریافت لیست…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  const BASE = "/inventory_managing";

  // ====== 1) گرفتن و نمایش همه اینونتوری‌ها (editable) ======
  function refreshInventories() {
    const tbody = document.getElementById("invBody");
    hideStatus();
    tbody.innerHTML = `<tr><td colspan="4">در حال دریافت لیست…</td></tr>`;

    fetch(`${BASE}/get-allInventories`, { method: "GET" })
            .then(res => {
              if (!res.ok) return res.text().then(t => { throw new Error(t || "خطا در دریافت لیست"); });
              return res.json();
            })
            .then(data => {
              if (!Array.isArray(data) || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4">هیچ اینونتوری‌ای ثبت نشده است.</td></tr>`;
                return;
              }

              tbody.innerHTML = "";

              data.forEach((inv, i) => {
                const originalName = String(inv?.name ?? "");
                const originalAmount = Number(inv?.amount ?? 0);

                const tr = document.createElement("tr");

                // هر ردیف original ها رو نگه می‌داریم تا بفهمیم تغییر کرده یا نه
                tr.dataset.originalName = originalName;
                tr.dataset.originalAmount = String(originalAmount);

                tr.innerHTML = `
            <td>${i + 1}</td>

            <td>
              <input class="cell-input inv-name"
                     type="text"
                     value="${escapeHtmlAttr(originalName)}"
                     oninput="onRowEdit(this)">
            </td>

            <td>
              <input class="cell-input inv-amount"
                     type="number"
                     value="${originalAmount}"
                     oninput="onRowEdit(this)">
            </td>

            <td>
              <button class="row-save" onclick="saveRow(this)">ثبت ✅</button>
            </td>
          `;

                tbody.appendChild(tr);
              });
            })
            .catch(e => {
              tbody.innerHTML = `<tr><td colspan="4">ارتباط با سرور برقرار نشد</td></tr>`;
              showStatus("مشکل ارتباط یا خطای سرور:\n" + (e?.message || e), true);
            });
  }

  // ====== وقتی چیزی توی ردیف تغییر کرد: دکمه ثبت همون ردیف ظاهر بشه ======
  function onRowEdit(inputEl) {
    const tr = inputEl.closest("tr");
    if (!tr) return;

    const nameVal = tr.querySelector(".inv-name").value.trim();
    const amountValRaw = tr.querySelector(".inv-amount").value;
    const amountVal = amountValRaw === "" ? NaN : Number(amountValRaw);

    const origName = tr.dataset.originalName ?? "";
    const origAmount = Number(tr.dataset.originalAmount ?? "0");

    const changed =
            nameVal !== origName ||
            (Number.isFinite(amountVal) && amountVal !== origAmount) ||
            (!Number.isFinite(amountVal) && amountValRaw !== String(origAmount)); // حالت خالی/نامعتبر

    const saveBtn = tr.querySelector(".row-save");
    saveBtn.style.display = changed ? "inline-block" : "none";
  }

  // ====== دکمه ثبت ردیف: فعلاً placeholder (بعداً endpoint رو می‌دی) ======
  function saveRow(btnEl) {
    const tr = btnEl.closest("tr");
    if (!tr) return;

    const oldName = tr.dataset.originalName; // اسم قدیمی از DB
    const newName = tr.querySelector(".inv-name").value.trim();
    const newAmountRaw = tr.querySelector(".inv-amount").value;
    const newAmount = Number(newAmountRaw);

    if (!newName) {
      showStatus("نام نمی‌تواند خالی باشد.", true);
      return;
    }
    if (newAmountRaw === "" || isNaN(newAmount)) {
      showStatus("amount معتبر وارد کن.", true);
      return;
    }

    const payload = { name: newName, amount: newAmount };

    // قفل کردن دکمه تا دوبار کلیک نشه
    btnEl.disabled = true;
    btnEl.textContent = "در حال ذخیره…";

    fetch(`${BASE}/edit/${encodeURIComponent(oldName)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
            .then(async res => {
              const text = await res.text(); // چون String برمی‌گردونی
              if (!res.ok) throw new Error(text || "خطا در ویرایش");

              // ✅ موفق: همون ردیف رو با مقدار جدید sync می‌کنیم
              tr.dataset.originalName = newName;
              tr.dataset.originalAmount = String(newAmount);

              // دکمه رو مخفی کن
              btnEl.style.display = "none";

              // آزادسازی دکمه
              btnEl.disabled = false;
              btnEl.textContent = "ثبت ✅";

              showStatus("✅ " + (text || "inventory edited successfully"), false);

              // (اختیاری ولی خوب) برای اینکه ترتیب/داده‌های دیگر هم sync شوند:
              // refreshInventories();
            })
            .catch(e => {
              btnEl.disabled = false;
              btnEl.textContent = "ثبت ✅";
              showStatus("❌ ویرایش ناموفق:\n" + (e?.message || e), true);
            });
  }

  // ====== این تابع رو بعداً با API واقعی edit پر می‌کنیم ======
  function editInventoryPlaceholder(inventoryNamePathParam, payload) {
    console.log("EDIT INVENTORY (placeholder) => path inventoryName:", inventoryNamePathParam);
    console.log("payload:", payload);

    // بعداً که گفتی endpoint چیه، اینجا fetch می‌زنیم.
    // مثلاً احتمالاً چیزی شبیه:
    // fetch(`${BASE}/edit/${encodeURIComponent(inventoryNamePathParam)}`, { ... })
  }

  // ====== helpers ======
  function showStatus(msg, isError) {
    const el = document.getElementById("status");
    el.style.display = "block";
    el.classList.remove("ok", "err");
    el.classList.add(isError ? "err" : "ok");
    el.textContent = msg;
  }

  function hideStatus() {
    const el = document.getElementById("status");
    el.style.display = "none";
    el.textContent = "";
    el.classList.remove("ok", "err");
  }

  function escapeHtml(str) {
    return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
  }

  // برای value داخل attribute
  function escapeHtmlAttr(str) {
    return escapeHtml(str).replaceAll("\n", " ");
  }

  window.addEventListener("DOMContentLoaded", refreshInventories);
</script>
</body>
</html>
