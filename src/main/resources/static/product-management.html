<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>مدیریت محصولات</title>

    <style>
        body{
            direction: rtl;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            margin: 0;
            padding: 24px;
            color:#111827;
        }

        .container{
            max-width: 1000px;
            margin: 0 auto;
        }

        .header{
            background: #ffffff;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
            display:flex;
            justify-content: space-between;
            align-items:center;
            flex-wrap: wrap;
        }

        .header h2{
            margin:0;
            font-size:18px;
            font-weight:800;
        }

        .btn{
            border:none;
            border-radius:10px;
            padding:10px 14px;
            cursor:pointer;
            font-size:14px;
            transition:0.15s;
        }

        .btn.primary{ background:#0ea5e9; color:white; }
        .btn.gray{ background:#64748b; color:white; }

        .btn:hover{ opacity:0.9; transform:translateY(-1px); }

        .card{
            margin-top:18px;
            background:#fff;
            padding:20px;
            border-radius:14px;
            box-shadow:0 6px 16px rgba(0,0,0,0.06);
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:700;
            font-size:13px;
            color:#334155;
        }

        input{
            width:100%;
            padding:10px 12px;
            border:1px solid #e5e7eb;
            border-radius:10px;
            margin-bottom:16px;
            font-size:14px;
            outline:none;
            transition:0.15s;
        }

        input:focus{
            border-color:#0ea5e9;
            box-shadow:0 0 0 3px rgba(14,165,233,0.12);
        }

        table{
            width:100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td{
            border-bottom:1px solid #e5e7eb;
            padding:12px;
            text-align:center;
        }

        th{
            background:#f1f5f9;
            font-weight:800;
        }

        tr:hover td{
            background:#f8fafc;
        }

        .status{
            margin-top:12px;
            border-radius:12px;
            padding:10px 12px;
            border:1px solid #e5e7eb;
            background:#f9fafb;
            font-size:13px;
            display:none;
            white-space: pre-wrap;
        }

        .status.ok{ border-color:rgba(34,197,94,0.35); background:rgba(34,197,94,0.1); }
        .status.err{ border-color:rgba(239,68,68,0.35); background:rgba(239,68,68,0.1); }

    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>مدیریت محصولات</h2>
        <button class="btn gray" onclick="goHome()">🏠 صفحه اصلی</button>
    </div>

    <!-- فرم ثبت -->
    <div class="card">

        <label>نام محصول</label>
        <input type="text" id="productName" placeholder="مثلاً نوشابه">

        <label>مقدار اولیه</label>
        <input type="number" id="productAmount" placeholder="مثلاً 100">

        <button class="btn primary" onclick="saveProduct()">➕ ثبت محصول</button>

        <div id="status" class="status"></div>

    </div>

    <!-- جدول نمایش -->
    <div class="card">
        <h3 style="margin-top:0;">لیست محصولات</h3>

        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>نام محصول</th>
                <th>مقدار</th>
            </tr>
            </thead>
            <tbody id="productTableBody">
            <tr><td colspan="3">در حال دریافت لیست...</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>

    const BASE = "/ProductManaging"; // اگر prefix داری اینجا بذار

    function goHome(){
        window.location.href = "/";
    }

    function showStatus(msg, isError){
        const el = document.getElementById("status");
        el.style.display = "block";
        el.classList.remove("ok","err");
        el.classList.add(isError ? "err" : "ok");
        el.textContent = msg;
    }

    function hideStatus(){
        const el = document.getElementById("status");
        el.style.display = "none";
    }

    // =========================
    // ثبت محصول
    // =========================
    function saveProduct(){

        hideStatus();

        const name = document.getElementById("productName").value.trim();
        const amountRaw = document.getElementById("productAmount").value;
        const amount = Number(amountRaw);

        if(!name){
            showStatus("نام محصول نمی‌تواند خالی باشد.", true);
            return;
        }

        if(amountRaw === "" || isNaN(amount)){
            showStatus("مقدار معتبر وارد کن.", true);
            return;
        }

        const payload = { name, amount };

        fetch(`${BASE}/saveNewProduct`,{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify(payload)
        })
            .then(async res=>{
                if(!res.ok){
                    const t = await res.text();
                    throw new Error(t || "خطا در ثبت");
                }

                showStatus("✅ محصول ثبت شد.", false);

                document.getElementById("productName").value = "";
                document.getElementById("productAmount").value = "";

                loadProducts(); // رفرش جدول

            })
            .catch(e=>{
                showStatus("❌ " + (e.message || e), true);
            });
    }

    // =========================
    // گرفتن همه محصولات
    // =========================
    function loadProducts(){

        const tbody = document.getElementById("productTableBody");
        tbody.innerHTML = `<tr><td colspan="3">در حال دریافت لیست...</td></tr>`;

        fetch(`${BASE}/getAllproducts`, { method:"GET" })
            .then(res=>{
                if(!res.ok) throw new Error("خطا در دریافت محصولات");
                return res.json();
            })
            .then(data=>{

                if(!Array.isArray(data) || data.length === 0){
                    tbody.innerHTML = `<tr><td colspan="3">محصولی ثبت نشده است.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";

                data.forEach((p, index)=>{

                    const tr = document.createElement("tr");

                    tr.innerHTML = `
          <td>${index+1}</td>
          <td>${escapeHtml(p.name)}</td>
          <td>${p.amount}</td>
        `;

                    tbody.appendChild(tr);
                });

            })
            .catch(()=>{
                tbody.innerHTML = `<tr><td colspan="3">❌ خطا در ارتباط با سرور</td></tr>`;
            });
    }

    function escapeHtml(str){
        return String(str)
            .replaceAll("&","&amp;")
            .replaceAll("<","&lt;")
            .replaceAll(">","&gt;")
            .replaceAll('"',"&quot;")
            .replaceAll("'","&#039;");
    }

    window.addEventListener("DOMContentLoaded", loadProducts);

</script>

</body>
</html>
